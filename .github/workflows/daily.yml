name: Daily Training Advisor

on:
  workflow_dispatch:
    inputs:
      checkin_text:
        description: 'Check-in message text from Telegram'
        required: false
        type: string
      checkin_timestamp:
        description: 'Check-in message timestamp (Unix)'
        required: false
        type: string
  schedule:
    # 06:37 and 16:27 Uzbekistan time (UTC+5), after the athlete's check-in.
    # Off-the-hour minutes avoid GitHub's busiest scheduling slots.
    - cron: "37 1 * * *"
    - cron: "27 11 * * *"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and send report
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAININGPEAKS_ICAL_URL: ${{ secrets.TRAININGPEAKS_ICAL_URL }}
          IQAIR_API_KEY: ${{ secrets.IQAIR_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          CHECKIN_TEXT: ${{ inputs.checkin_text }}
          CHECKIN_TIMESTAMP: ${{ inputs.checkin_timestamp }}
        run: python -m app.main
